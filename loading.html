<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starting Xai'27 Assistant...</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root{
--bg1:#0f172a;
--bg2:#020617;
--accent:#00f5a0;
--text:#e2e8f0;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,var(--bg1),var(--bg2));
color:var(--text);
text-align:center;
}

/* Loader */
.loader{
width:50px;
height:50px;
border-radius:50%;
border:4px solid rgba(255,255,255,0.1);
border-top:4px solid var(--accent);
animation:spin 1s linear infinite;
margin-bottom:20px;
}

/* Title */
.title{
font-size:22px;
font-weight:500;
margin-bottom:6px;
}

/* subtitle */
.subtitle{
font-size:14px;
opacity:0.6;
}

/* animation */
@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

/* responsive */
@media(max-width:600px){

.loader{
width:40px;
height:40px;
}

.title{
font-size:18px;
}

.subtitle{
font-size:13px;
}

}

</style>

</head>

<body>

<div class="loader"></div>

<div class="title">Starting Xai'27 Assistant</div>

<div class="subtitle">Please wait...</div>

<script>

setTimeout(()=>{
window.location.href="https://xai-assistant-1.onrender.com/";
},3000);

</script>

</body>
</html>
