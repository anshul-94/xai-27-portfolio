<style>
  html, body {
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .resume-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    flex: 1;
  }

  .resume-card {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 20px;
    padding: 40px;
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.08);
    transition: 0.3s ease;
    width: 100%;
    max-width: 900px;
    text-align: center;
  }

  .resume-card:hover {
    transform: translateY(-5px);
  }

  .resume-card h1 {
    font-size: 2.5rem;
    font-weight: 700;
    margin-bottom: 15px;
    color: #fff;
  }

  .resume-card p {
    color: #b0b0b0;
    font-size: 1rem;
    margin-bottom: 20px;
  }

  .resume-frame {
    width: 100%;
    height: 650px;
    border-radius: 12px;
    border: none;
    margin-top: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.5);
  }

  .btn-download {
    display: inline-block;
    margin-top: 25px;
    padding: 12px 30px;
    border-radius: 30px;
    background: linear-gradient(135deg, #00e6a8, #00c2ff);
    color: #000;
    font-weight: 600;
    text-decoration: none;
    transition: 0.3s;
  }

  .btn-download:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 25px rgba(0, 255, 200, 0.3);
  }

  @media (max-width: 768px) {
    .resume-card {
      padding: 20px;
    }

    .resume-frame {
      height: 400px;
    }

    .resume-card h1 {
      font-size: 1.8rem;
    }
  }

  @media (max-width: 480px) {
    .resume-frame {
      height: 300px;
    }
  }
</style>
</head>

<script>
  const links = document.querySelectorAll("nav a");
  const currentPage = window.location.pathname.split("/").pop();

  links.forEach(link => {
    if (link.getAttribute("href") === currentPage || (currentPage === "" && link.getAttribute("href") === "index.html")) {
      link.classList.add("active");
    } else {
      link.classList.remove("active");
    }
  });
</script>
